name: CI Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  experiment:
    name: Run agent eval experiment
    runs-on: ubuntu-latest
    # ~30 executor visits per screening golden + 4 metrics per golden: long-running.
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # dagshub.init() reads this and wires up MLflow auth against DagsHub.
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
      # Jev (TypeSafe) makes every guardrail decision; without it the guards fail closed.
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      # No interactive prompt / phone-home from DeepEval in CI.
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen
